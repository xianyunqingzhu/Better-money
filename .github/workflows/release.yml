name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0,<7" "pytest>=8.0,<9"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --silent

      - name: Run business regression (unit + contract + real six-script runner)
        shell: pwsh
        run: |
          python -m pytest tests/test_real_legacy_runner.py tests/test_server_control.py tests/test_launcher.py -p no:cacheprovider

      - name: Build PyInstaller bundle
        shell: pwsh
        run: ./build/build_windows.ps1

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $env:BETTER_MONEY_BUNDLE_EXE = (Resolve-Path "./dist/BetterMoney/BetterMoney.exe")
          python -m pytest tests/test_bundle_smoke.py -p no:cacheprovider
          Remove-Item Env:BETTER_MONEY_BUNDLE_EXE

      - name: Build Inno Setup installer
        shell: pwsh
        run: ./build/build_installer.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
